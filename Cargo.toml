[package]
name = "scramjet-rs"
version = "0.98.7"
edition = "2024"
license = "Apache-2.0"
description = "An independent Rust terminal coding harness"

[dependencies]
httpdate = { version = "=1.0.3", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std", "float_roundtrip"] }
getrandom = { version = "=0.2.17", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "termios", "process", "event", "time"] }
signal-hook = { version = "=0.3.18", default-features = false }
libc = { version = "=0.2.190", default-features = false }
unicode-segmentation = { version = "=1.13.3", default-features = false }
unicode-width = { version = "=0.2.2", default-features = false }
spellbook = { version = "=0.4.2", default-features = false, features = ["default-hasher"] }
bytes = { version = "=1.12.1", default-features = false }
http-body-util = { version = "=0.1.5", default-features = false }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = { version = "=0.8.5", default-features = false }
tokio-rustls = { version = "=0.26.6", default-features = false }
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "rt-multi-thread", "macros", "net", "time", "process", "io-util", "sync"] }
yaml-rust2 = { version = "=0.13.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = { version = "=0.13.6", default-features = false, features = ["html"] }
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-onig"] }
x11rb = { version = "=0.13.2", default-features = false }
sse-stream = { version = "=0.2.6", default-features = false }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }
