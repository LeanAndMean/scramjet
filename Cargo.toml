[package]
name = "scramjet-rs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "An independent Rust terminal coding harness"

[dependencies]
httpdate = { version = "=1.0.3", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
crossterm = { version = "=0.29.0", default-features = false }
ratatui-core = { version = "=0.1.2", default-features = false, features = ["std"] }
ratatui-crossterm = { version = "=0.1.2", default-features = false, features = ["crossterm_0_29"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "termios", "process"] }
signal-hook = { version = "=0.3.18", default-features = false }
unicode-segmentation = { version = "=1.13.3", default-features = false }
unicode-width = { version = "=0.2.2", default-features = false }
bytes = { version = "=1.12.1", default-features = false }
http-body-util = { version = "=0.1.5", default-features = false }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "macros", "net", "sync", "time", "io-util"] }

[dev-dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["test-util"] }
