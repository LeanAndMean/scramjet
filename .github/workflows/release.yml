name: Stage 4 real native dependency, NO PUBLICATION
on:
  push:
    branches:
      - diagnostics/issue-608-stage4-gate
permissions:
  contents: read
jobs:
  native:
    uses: ./.github/workflows/terminal-feasibility.yml
    permissions:
      contents: read
  publish:
    name: Publication surrogate (echo only)
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - run: echo "NATIVE_PREREQUISITE_ACCEPTED $GITHUB_SHA"; test -z
          "$ACTIONS_ID_TOKEN_REQUEST_URL"
  verify:
    name: verify published release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - run: echo "SURROGATE_VERIFIED $GITHUB_SHA"
