name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Validate release identity
        run: node .github/scripts/release.mjs validate

      - name: Validate registry configuration
        run: bash .github/scripts/validate-registry.sh

      - name: Pin release tooling
        run: |
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 14)) throw new Error("Node 22.14.0 or newer is required")'
          npm install --global npm@11.5.1 --registry https://registry.npmjs.org/
          node --version
          npm --version

      - name: Preflight release candidate
        if: github.run_attempt == 1
        run: node .github/scripts/release.mjs preflight "$GITHUB_SHA"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Publish packages
        run: node .github/scripts/release.mjs publish

  verify:
    name: verify published release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Validate release identity
        run: node .github/scripts/release.mjs validate

      - name: Validate registry configuration
        run: bash .github/scripts/validate-registry.sh

      - name: Pin release tooling
        run: |
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 14)) throw new Error("Node 22.14.0 or newer is required")'
          npm install --global npm@11.5.1 --registry https://registry.npmjs.org/
          node --version
          npm --version

      - name: Verify published release
        run: node .github/scripts/release.mjs verify
