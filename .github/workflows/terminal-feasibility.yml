name: Native terminal feasibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-terminal-result:
    name: Native terminal result
    if: ${{ always() }}
    needs: [native-safety, native-terminal]
    runs-on: ubuntu-latest
    steps:
      - name: Require every native job to succeed
        env:
          SAFETY_RESULT: ${{ needs.native-safety.result }}
          INTERACTION_RESULT: ${{ needs.native-terminal.result }}
        run: test "$SAFETY_RESULT" = success && test "$INTERACTION_RESULT" = success

  native-safety:
    name: native-safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Provision disposable Kitty desktop
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y kitty xvfb xdotool openbox scrot
      - name: Provision disposable iTerm2
        if: runner.os == 'macOS'
        run: brew install --cask iterm2
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check iTerm2 graphics and handoffs
        if: runner.os == 'macOS'
        run: python3 .github/scripts/terminal-safety.py "$RUNNER_TEMP/terminal-safety"
      - name: Check Kitty graphics and handoffs
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- bash -c '
            openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
            python3 .github/scripts/terminal-safety.py "$RUNNER_TEMP/terminal-safety"
          '
      - name: Preserve native safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-safety-${{ matrix.os }}
          path: ${{ runner.temp }}/terminal-safety
          if-no-files-found: error
          retention-days: 7

  native-terminal:
    name: native-terminal (${{ matrix.os }}, ${{ matrix.terminal }}, tmux=${{ matrix.tmux }}, stock=${{ matrix.stock || false }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            terminal: apple
            tmux: false
          - os: macos-15
            terminal: iterm2
            tmux: false
          - os: macos-15
            terminal: apple
            tmux: false
            stock: true
          - os: macos-15
            terminal: iterm2
            tmux: false
            stock: true
          - os: macos-15-intel
            terminal: apple
            tmux: false
            stock: true
          - os: macos-15-intel
            terminal: iterm2
            tmux: false
            stock: true
          - os: ubuntu-24.04
            terminal: vte
            tmux: false
          - os: ubuntu-24.04
            terminal: vte
            tmux: true
          - os: ubuntu-24.04
            terminal: xterm
            tmux: false
          - os: ubuntu-24.04
            terminal: kitty
            tmux: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Provision disposable Linux desktop
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4-terminal xterm kitty xvfb xdotool x11-utils openbox xclip scrot tmux
      - name: Provision disposable iTerm2
        if: matrix.terminal == 'iterm2'
        run: brew install --cask iterm2
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Pack isolated native candidate
        if: matrix.stock == true
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/native-pack"
          PREFIX="$RUNNER_TEMP/native-install"
          mkdir -p "$PACK_DIR" "$PREFIX"
          for package in tui ai agent coding-agent scramjet; do
            npm pack -w "packages/$package" --pack-destination "$PACK_DIR" --json > "$PACK_DIR/$package.json"
          done
          npm install --ignore-scripts --prefix "$PREFIX" -g "$PACK_DIR"/*.tgz
          INSTALLED_ROOT="$PREFIX/lib/node_modules/@leanandmean/scramjet"
          node .github/scripts/installed-runtime-smoke.mjs "$INSTALLED_ROOT" "$RUNNER_TEMP/native-smoke" > "$PACK_DIR/closure.json"
          echo "SCRAMJET_TUI_INSTALLED_ROOT=$INSTALLED_ROOT" >> "$GITHUB_ENV"
      - name: Probe native macOS terminal
        if: runner.os == 'macOS'
        env:
          STOCK_COPY: ${{ matrix.stock || false }}
        run: |
          args=()
          if [[ "$STOCK_COPY" == true ]]; then args+=(--stock-copy); fi
          python3 .github/scripts/terminal-probe.py "$RUNNER_TEMP/terminal-evidence" --terminal=${{ matrix.terminal }} "${args[@]}"
      - name: Probe Linux VTE terminal
        if: runner.os == 'Linux'
        env:
          PROBE_TMUX: ${{ matrix.tmux }}
          PROBE_TERMINAL: ${{ matrix.terminal }}
        run: |
          xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- bash -c '
            mkdir -p "$RUNNER_TEMP/terminal-evidence"
            openbox > "$RUNNER_TEMP/terminal-evidence/openbox.log" 2>&1 &
            args=()
            if [[ "$PROBE_TMUX" == true ]]; then args+=(--tmux); fi
            python3 .github/scripts/terminal-probe.py "$RUNNER_TEMP/terminal-evidence" --terminal="$PROBE_TERMINAL" "${args[@]}"
          '
      - name: Preserve feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-feasibility-${{ matrix.os }}-${{ matrix.terminal }}-tmux-${{ matrix.tmux }}-stock-${{ matrix.stock || false }}
          path: |
            ${{ runner.temp }}/terminal-evidence
            ${{ runner.temp }}/native-pack/*.json
          if-no-files-found: error
          retention-days: 7
