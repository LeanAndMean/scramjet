name: Native terminal feasibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-copy-diagnostic:
    name: macOS copy diagnostic (${{ matrix.terminal }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terminal: [apple, iterm2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Provision disposable iTerm2
        if: matrix.terminal == 'iterm2'
        run: brew install --cask iterm2
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Compile bounded, non-requesting observer
        run: swiftc .github/scripts/macos-copy-observer.swift -o "$RUNNER_TEMP/macos-copy-observer"
      - name: Launch independently attributed observer without requesting access
        run: |
          mkdir -p "$RUNNER_TEMP/copy-diagnostic" "$RUNNER_TEMP/Issue608Observer.app/Contents/MacOS"
          cp "$RUNNER_TEMP/macos-copy-observer" "$RUNNER_TEMP/Issue608Observer.app/Contents/MacOS/observer"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>org.scramjet.issue608.observer</string><key>CFBundleName</key><string>Issue608Observer</string><key>CFBundleExecutable</key><string>observer</string><key>CFBundlePackageType</key><string>APPL</string><key>LSUIElement</key><true/></dict></plist>' > "$RUNNER_TEMP/Issue608Observer.app/Contents/Info.plist"
          open -n "$RUNNER_TEMP/Issue608Observer.app" --args "$RUNNER_TEMP/copy-diagnostic/independent-observer.json"
      - name: Observe stock shortcuts through production composition
        env:
          SCRAMJET_SCROLL_PROTOCOL: "1"
          SCRAMJET_MACOS_MOUSE_DIAGNOSTIC: ${{ runner.temp }}/copy-diagnostic/independent-observer.json
        run: python3 .github/scripts/terminal-probe.py "$RUNNER_TEMP/copy-diagnostic" --terminal=${{ matrix.terminal }} --copy-diagnostic
      - name: Stop bounded independent observer
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/copy-diagnostic/independent-observer.json"; then
            pid=$(jq -r '.capabilities.pid' "$RUNNER_TEMP/copy-diagnostic/independent-observer.json")
            kill -TERM "$pid" 2>/dev/null || true
          fi
      - name: Preserve diagnostic observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-608-copy-diagnostic-${{ matrix.terminal }}
          path: ${{ runner.temp }}/copy-diagnostic
          if-no-files-found: error
          retention-days: 7
