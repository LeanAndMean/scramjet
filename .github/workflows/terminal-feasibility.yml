name: Native terminal feasibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-copy-diagnostic:
    name: macOS copy diagnostic (${{ matrix.terminal }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terminal: [apple, iterm2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Provision disposable iTerm2
        if: matrix.terminal == 'iterm2'
        run: brew install --cask iterm2
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Compile bounded, non-requesting observer
        run: swiftc .github/scripts/macos-copy-observer.swift -o "$RUNNER_TEMP/macos-copy-observer"
      - name: Observe stock shortcuts through production composition
        env:
          SCRAMJET_MACOS_OBSERVER: ${{ runner.temp }}/macos-copy-observer
        run: python3 .github/scripts/terminal-probe.py "$RUNNER_TEMP/copy-diagnostic" --terminal=${{ matrix.terminal }} --copy-diagnostic
      - name: Preserve diagnostic observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-608-copy-diagnostic-${{ matrix.terminal }}
          path: ${{ runner.temp }}/copy-diagnostic
          if-no-files-found: error
          retention-days: 7
