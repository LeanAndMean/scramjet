name: Native terminal feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage2-smoke:
    runs-on: macos-15
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        terminal: [apple, iterm2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - if: matrix.terminal == 'iterm2'
        run: brew install --cask iterm2
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python3 .github/scripts/terminal-probe.py "$RUNNER_TEMP/stage2-copy" --terminal=${{ matrix.terminal }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-copy-${{ matrix.terminal }}
          path: ${{ runner.temp }}/stage2-copy
          if-no-files-found: error
          retention-days: 7
