name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # postinstall cleanup has a dedicated isolated smoke test.
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Published coding-agent docs import guard
        run: |
          set -euo pipefail
          if grep -R -nE '@leanandmean/pi-|@earendil-works/pi-|@mariozechner/pi-' packages/coding-agent/README.md packages/coding-agent/docs packages/coding-agent/examples; then
            echo "Found stale package imports in published coding-agent docs/examples." >&2
            exit 1
          fi

      - name: npm pack round-trip smoke
        # Pack every publishable package, verify Scramjet tarball contents,
        # install the local tarballs, and run the installed binary.
        run: |
          set -euo pipefail
          PACK_DIR=$(mktemp -d)
          PREFIX=$(mktemp -d)
          npm pack -w packages/tui --pack-destination "$PACK_DIR"
          npm pack -w packages/ai --pack-destination "$PACK_DIR"
          npm pack -w packages/agent --pack-destination "$PACK_DIR"
          npm pack -w packages/coding-agent --pack-destination "$PACK_DIR"
          npm pack -w packages/scramjet --pack-destination "$PACK_DIR"
          SCRAMJET_TARBALL=$(ls "$PACK_DIR"/leanandmean-scramjet-*.tgz | head -n1)
          test -n "$SCRAMJET_TARBALL" || { echo "no Scramjet tarball produced" >&2; exit 1; }
          TARBALL_CONTENTS=$(mktemp)
          tar -tzf "$SCRAMJET_TARBALL" > "$TARBALL_CONTENTS"
          grep -qxF 'package/assets/scramjet-logo.png' "$TARBALL_CONTENTS"
          grep -qF 'package/dist/index.js' "$TARBALL_CONTENTS"
          grep -qxF 'package/dist/command-lint-cli.js' "$TARBALL_CONTENTS"
          grep -qF 'package/bin/scramjet.js' "$TARBALL_CONTENTS"
          grep -qxF 'package/bin/scramjet-command-lint.js' "$TARBALL_CONTENTS"
          grep -qF 'package/scripts/postinstall.js' "$TARBALL_CONTENTS"
          grep -qF 'package/mach12/commands/mach12:issue-create.md' "$TARBALL_CONTENTS"
          grep -qF 'package/mach12/agents/mach12:code-explorer.md' "$TARBALL_CONTENTS"
          grep -qF 'package/mach12/agents/mach12:structural-mapper.md' "$TARBALL_CONTENTS"
          grep -qxF 'package/mach12/autonomy-defaults.yaml' "$TARBALL_CONTENTS"
          grep -qxF 'package/skills/writing-scramjet-commands/SKILL.md' "$TARBALL_CONTENTS"
          grep -qF 'package/scramjet/set.yaml' "$TARBALL_CONTENTS"
          grep -qxF 'package/scramjet/agents/scramjet:command-reviewer.md' "$TARBALL_CONTENTS"
          grep -qF 'package/scramjet/commands/scramjet:troubleshoot.md' "$TARBALL_CONTENTS"
          XDG_DATA_HOME="$PREFIX/data" npm install --ignore-scripts --prefix "$PREFIX" -g \
            "$PACK_DIR"/leanandmean-tui-*.tgz \
            "$PACK_DIR"/leanandmean-ai-*.tgz \
            "$PACK_DIR"/leanandmean-agent-*.tgz \
            "$PACK_DIR"/leanandmean-coding-agent-*.tgz \
            "$SCRAMJET_TARBALL"
          INSTALLED_ROOT="$PREFIX/lib/node_modules/@leanandmean/scramjet"
          test -f "$INSTALLED_ROOT/dist/index.js"
          INSTALLED_SMOKE=$(mktemp -d)
          INSTALLED_STDOUT=$(mktemp)
          INSTALLED_STDERR=$(mktemp)
          INSTALLED_STATUS=0
          HOME="$INSTALLED_SMOKE/home" \
            XDG_DATA_HOME="$INSTALLED_SMOKE/data" \
            SCRAMJET_CODING_AGENT_DIR="$INSTALLED_SMOKE/agent" \
            node .github/scripts/installed-runtime-smoke.mjs "$INSTALLED_ROOT" "$INSTALLED_SMOKE" \
            >"$INSTALLED_STDOUT" 2>"$INSTALLED_STDERR" || INSTALLED_STATUS=$?
          show_installed_smoke_output() {
            cat "$INSTALLED_STDOUT"
            cat "$INSTALLED_STDERR" >&2
          }
          if [ "$INSTALLED_STATUS" -ne 0 ]; then
            show_installed_smoke_output
            exit "$INSTALLED_STATUS"
          fi
          jq -e '.agentCatalog == true and .subagentRegistry == true and .migrationWarning == true' "$INSTALLED_STDOUT" || {
            status=$?
            show_installed_smoke_output
            exit "$status"
          }
          grep -qF 'legacy bundled command set' "$INSTALLED_STDERR" || {
            status=$?
            show_installed_smoke_output
            exit "$status"
          }
          XDG_DATA_HOME="$PREFIX/data" "$PREFIX/bin/scramjet" --help >/dev/null
          "$PREFIX/bin/scramjet-command-lint" --help >/dev/null
          LINT_FIXTURE=$(mktemp -d)
          mkdir -p "$LINT_FIXTURE/sample/commands"
          printf '%s\n' '---' '---' '# Smoke' '' '## Goals' '' '- Verify the installed executable.' > "$LINT_FIXTURE/sample/commands/sample:smoke.md"
          "$PREFIX/bin/scramjet-command-lint" --strict --json "$LINT_FIXTURE/sample" | node -e '
            const report = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const expected = { files: 1, errors: 0, warnings: 0 };
            if (report.summary.files !== expected.files || report.summary.errors !== expected.errors || report.summary.warnings !== expected.warnings) {
              throw new Error(`Expected lint summary ${JSON.stringify(expected)}, observed report ${JSON.stringify(report)}`);
            }
          '
          RPC_STDOUT=$(mktemp)
          RPC_STDERR=$(mktemp)
          SCRAMJET_OFFLINE=1 \
            XDG_DATA_HOME="$PREFIX/data" \
            PI_CODING_AGENT_DIR="$PREFIX/pi-agent" \
            SCRAMJET_CODING_AGENT_DIR="$PREFIX/scramjet-agent" \
            node --input-type=module - "$PREFIX/bin/scramjet" "$RPC_STDOUT" "$RPC_STDERR" <<'NODE'
          import { openSync, readFileSync, writeFileSync } from "node:fs";
          import { spawn } from "node:child_process";
          import { createInterface } from "node:readline";

          const [binary, stdoutPath, stderrPath] = process.argv.slice(2);
          const child = spawn(binary, ["--mode", "rpc", "--no-session"], {
            env: process.env,
            stdio: ["pipe", "pipe", openSync(stderrPath, "w")],
          });
          const lines = [];
          let received = false;
          let killTimeout;
          let responseTimeout;
          const close = new Promise((resolve) => child.on("close", (...args) => resolve(args)));
          const timeout = new Promise((_, reject) => {
            responseTimeout = setTimeout(() => {
              child.kill("SIGTERM");
              killTimeout = setTimeout(() => child.kill("SIGKILL"), 5_000);
              reject(new Error(`RPC timed out after 30s; stderr: ${stderrPath}\n${readFileSync(stderrPath, "utf8")}`));
            }, 30_000);
          });
          createInterface({ input: child.stdout }).on("line", (line) => {
            lines.push(line);
            const response = JSON.parse(line);
            if (response.id === "commands" && response.type === "response" && response.command === "get_commands") {
              if (!response.success) throw new Error(response.error);
              received = true;
              child.stdin.end();
            }
          });
          child.stdin.write(`${JSON.stringify({ id: "commands", type: "get_commands" })}\n`);
          const [code] = await Promise.race([close, timeout]);
          clearTimeout(responseTimeout);
          clearTimeout(killTimeout);
          writeFileSync(stdoutPath, `${lines.join("\n")}\n`);
          if (!received || code !== 0) {
            throw new Error(`RPC failed: received=${received}, status=${code}; stderr: ${stderrPath}\n${readFileSync(stderrPath, "utf8")}`);
          }
          NODE
          jq -e 'select(.id == "commands" and .type == "response" and .command == "get_commands" and .success == true) | (.data.commands | any(.name == "mach12:issue-create") and any(.name == "scramjet:troubleshoot"))' "$RPC_STDOUT"
          test ! -e "$PREFIX/data/scramjet/mach12"
          test ! -e "$PREFIX/data/scramjet/scramjet"
          rm -rf "$PACK_DIR" "$PREFIX" "$LINT_FIXTURE" "$TARBALL_CONTENTS" "$RPC_STDOUT" "$RPC_STDERR" \
            "$INSTALLED_SMOKE" "$INSTALLED_STDOUT" "$INSTALLED_STDERR"

      - name: postinstall cleanup smoke
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          HOME_DIR="$TMP/home"
          DATA_DIR="$TMP/data"
          LEGACY="$DATA_DIR/scramjet/mach12"
          EXTENSIONS="$HOME_DIR/.scramjet/agent/extensions"
          mkdir -p "$LEGACY/commands" "$EXTENSIONS"
          printf 'legacy bytes\0unchanged' > "$LEGACY/commands/mach12:legacy.md"
          ln -s "$TMP/outside" "$LEGACY/linked"
          printf 'outside\n' > "$TMP/outside"
          ln -s "$(pwd)/packages/coding-agent/examples/extensions/subagent" "$EXTENSIONS/subagent"
          BEFORE_FILE=$(shasum -a 256 "$LEGACY/commands/mach12:legacy.md")
          BEFORE_OUTSIDE=$(shasum -a 256 "$TMP/outside")
          BEFORE_LINK=$(readlink "$LEGACY/linked")
          HOME="$HOME_DIR" XDG_DATA_HOME="$DATA_DIR" node packages/scramjet/scripts/postinstall.js
          test ! -e "$EXTENSIONS/subagent"
          test "$BEFORE_FILE" = "$(shasum -a 256 "$LEGACY/commands/mach12:legacy.md")"
          test "$BEFORE_OUTSIDE" = "$(shasum -a 256 "$TMP/outside")"
          test "$BEFORE_LINK" = "$(readlink "$LEGACY/linked")"
          test ! -e "$DATA_DIR/scramjet/scramjet"
          rm -rf "$TMP"
