# Whatever cargo runs (tests, the scripts they start, `cargo run`) keeps its configuration, state and
# packages in scratch directories under target/, never the user's own, which unit tests would
# otherwise write into (an empty auth.json, the sandbox's cache).
[env]
XDG_CONFIG_HOME = { value = "target/test-home/config", relative = true, force = true }
XDG_STATE_HOME = { value = "target/test-home/state", relative = true, force = true }
XDG_DATA_HOME = { value = "target/test-home/data", relative = true, force = true }

# From Rust 1.100, std links WaitOnAddress, WakeByAddressAll and WakeByAddressSingle through
# -lkernel32 ahead of -lsynchronization, and older MinGW-w64 import libraries (Ubuntu 20.04's 7.0)
# list them under KERNEL32.dll, which does not export them: the program then fails to start.
# Marked undefined from the start, they are taken from this crate's -lsynchronization, which the
# linker reads before std's libraries: api-ms-win-core-synch-l1-2-0.dll, as before 1.100.
[target.x86_64-pc-windows-gnu]
rustflags = [
  "-C", "link-arg=-Wl,-u,__imp_WaitOnAddress",
  "-C", "link-arg=-Wl,-u,__imp_WakeByAddressAll",
  "-C", "link-arg=-Wl,-u,__imp_WakeByAddressSingle",
  "-l", "synchronization",
]
